# One job on purpose: GitHub bills private-repo minutes per job (pattern from teba-group-os).
name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build -w apps/web
      - name: Server bundle is up to date (api/[route].js is generated from apps/web/server)
        run: npm run build:api -w apps/web && git diff --exit-code -- 'apps/web/api'
